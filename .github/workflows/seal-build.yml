name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated top-level test names to run instead of the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  module-zip:
    name: Build module zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build module-zip helper
        run: |
          set -eux
          HELPER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" ./create_mod.go

      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          # The seal CI files under .github are not part of the released module.
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" golang.org/x/net v0.45.0 \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.45.0.zip" | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.45.0.zip
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # Builds the testing/synctest-based http2 and internal/http3 tests
      # (//go:build go1.24 && goexperiment.synctest) under Go 1.25.
      GOEXPERIMENT: synctest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Enable loopback IPv6 and unprivileged ICMP (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=0
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          ip addr show lo

      - name: Build
        run: |
          set -eux
          go version
          go build ./...

      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -eux
          if [ -n "$TEST_FILTER" ]; then
            go test -v -run "^($(echo "$TEST_FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee "$RUNNER_TEMP/scoped.log"
            for t in $TEST_FILTER; do grep -qE "^=== RUN[[:space:]]+${t}(/|$)" "$RUNNER_TEMP/scoped.log" || { echo "selected test $t did not run"; exit 1; }; done
          else
            go test -v ./... 2>&1 | tee "$RUNNER_TEMP/full.log"
            set +x
            awk '/^--- PASS/{p++} /^--- FAIL/{f++} /^--- SKIP/{s++} END{printf "TEST SUMMARY: %d passed, %d failed, %d skipped\n", p, f, s}' "$RUNNER_TEMP/full.log"
            echo "Skipped tests and the reason each one logged (t.Skip message):"
            awk '
              /^=== (RUN|CONT|NAME) / { cur = $3; next }
              /^ *--- SKIP: / { printf "SKIPPED %s -- reason: %s\n", $3, (($3 in why) ? why[$3] : "(none logged)"); next }
              /^ *--- / { next }
              /^ +[A-Za-z0-9_]+\.go:[0-9]+: / { l = $0; sub(/^ +/, "", l); why[cur] = ((cur in why) ? why[cur] " | " l : l); next }
              /^(ok|FAIL|\?) / { cur = ""; split("", why); print }
            ' "$RUNNER_TEMP/full.log"
          fi
